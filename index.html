async function hashValue(v) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(v));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,"0")).join("");
}

// ── SUPABASE DATA LAYER ───────────────────────────────────────────────────────
async function dbGetConfig() {
  const { data } = await db.from("config").select("*").eq("id",1).single();
  return data;
}
async function dbSaveConfig(cfg) {
  await db.from("config").upsert({
    id:1,
    title: cfg.title,
    subtitle: cfg.subtitle,
    reglement: cfg.reglement,
    hidden: cfg.hidden,
    end_date: cfg.endDate||"",
    restaurants: cfg.restaurants||["Decize","Avermes","Moulins"],
    criteria: cfg.criteria||[],
  });
}
async function dbGetParticipants() {
  const { data } = await db.from("participants").select("*").order("updated_at",{ascending:false});
  return (data||[]).map(p => ({
    id: p.id,
    name: p.name,
    restaurant: p.restaurant,
    scores: p.scores||{},
    notes: p.notes||{},
    updatedAt: new Date(p.updated_at).getTime(),
  }));
}
async function dbSaveParticipant(p) {
  await db.from("participants").upsert({
    id: p.id,
    name: p.name,
    restaurant: p.restaurant||null,
    scores: p.scores||{},
    notes: p.notes||{},
    updated_at: new Date().toISOString(),
  });
}
async function dbDeleteParticipant(id) {
  await db.from("participants").delete().eq("id",id);
}
async function dbGetAuth() {
  const { data } = await db.from("auth_config").select("*").eq("id",1).single();
  return data ? {
    pinHash: data.pin_hash,
    passwordHash: data.password_hash,
    attempts: data.attempts||0,
    lockedUntil: data.locked_until||null,
  } : null;
}
async function dbSaveAuth(auth) {
  await db.from("auth_config").upsert({
    id:1,
    pin_hash: auth.pinHash,
    password_hash: auth.passwordHash,
    attempts: auth.attempts||0,
    locked_until: auth.lockedUntil||null,
  });
}
async function dbAddLog(msg) {
  await db.from("historique").insert({ message: msg });
}
async function dbGetLog() {
  const { data } = await db.from("historique").select("*").order("created_at",{ascending:false}).limit(50);
  return (data||[]).map(l => ({ ts: new Date(l.created_at).getTime(), msg: l.message }));
}
function computeTotal(p, criteria) {
  return criteria.reduce((s, c) => s + (parseFloat(p.scores?.[c.id] ?? 0) / (parseFloat(c.max) || 1)) * parseFloat(c.weight || 0), 0);
}
function fmtDate(ts) {
  if (!ts) return null;
  return new Date(ts).toLocaleString("fr-FR", { day:"2-digit", month:"2-digit", year:"numeric", hour:"2-digit", minute:"2-digit" });
}

function Countdown({ target }) {
  const [secs, setSecs] = useState(Math.max(0, Math.ceil((target - Date.now()) / 1000)));
  useEffect(() => {
    const iv = setInterval(() => {
      const r = Math.max(0, Math.ceil((target - Date.now()) / 1000));
      setSecs(r);
      if (!r) clearInterval(iv);
    }, 1000);
    return () => clearInterval(iv);
  }, [target]);
  if (!secs) return null;
  const d = Math.floor(secs / 86400), h = Math.floor((secs % 86400) / 3600), m = Math.floor((secs % 3600) / 60), s = secs % 60;
  return (
    <div style={mc.countdown}>
      <div style={mc.countdownLabel}>⏳ Fin du concours dans</div>
      <div style={mc.countdownRow}>
        {d > 0 && <><span style={mc.countdownNum}>{d}</span><span style={mc.countdownUnit}>j</span></>}
        <span style={mc.countdownNum}>{String(h).padStart(2,"0")}</span><span style={mc.countdownUnit}>h</span>
        <span style={mc.countdownNum}>{String(m).padStart(2,"0")}</span><span style={mc.countdownUnit}>m</span>
        <span style={mc.countdownNum}>{String(s).padStart(2,"0")}</span><span style={mc.countdownUnit}>s</span>
      </div>
    </div>
  );
}

// ── MAIN APP ─────────────────────────────────────────────────────────────────
function App() {
  const [view, setView]               = useState("public");
  const [auth, setAuth]               = useState(null);
  const [ready, setReady]             = useState(false);
  const [config, setConfig]           = useState({ title:"Mon Concours", subtitle:"", criteria:[], reglement:"", hidden:false, endDate:"", startDate:"", restaurants:["Decize","Avermes","Moulins"] });
  const [participants, setParticipants] = useState([]);
  const [log, setLog]                 = useState([]);
  const logoutTimer                   = useRef(null);

  useEffect(() => {
    async function init() {
      try {
        const [a, c, p, l] = await Promise.all([
          dbGetAuth(),
          dbGetConfig(),
          dbGetParticipants(),
          dbGetLog(),
        ]);
        // Auth init
        let fa = a;
        if (!fa?.pinHash) {
          const [ph, pwh] = await Promise.all([hashValue(DEFAULT_PIN), hashValue(DEFAULT_PASSWORD)]);
          fa = { pinHash:ph, passwordHash:pwh, attempts:0, lockedUntil:null };
          await dbSaveAuth(fa);
        }
        setAuth(fa);
        // Config
        if (c) {
          setConfig({
            title: c.title||"Mon Concours",
            subtitle: c.subtitle||"",
            criteria: c.criteria||[],
            reglement: c.reglement||"",
            hidden: c.hidden||false,
            endDate: c.end_date||"",
            restaurants: c.restaurants||["Decize","Avermes","Moulins"],
          });
        }
        setParticipants(p||[]);
        setLog(l||[]);
      } catch(e) {
        console.error("Init error:", e);
      }
      setReady(true);
    }
    init();

    // ── REALTIME SUBSCRIPTIONS ────────────────────────────────────────────────
    const chanParticipants = db
      .channel("participants-live")
      .on("postgres_changes", { event:"*", schema:"public", table:"participants" }, async () => {
        const p = await dbGetParticipants();
        setParticipants(p);
      })
      .subscribe();

    const chanConfig = db
      .channel("config-live")
      .on("postgres_changes", { event:"*", schema:"public", table:"config" }, async () => {
        const c = await dbGetConfig();
        if (c) setConfig({
          title: c.title||"Mon Concours",
          subtitle: c.subtitle||"",
          criteria: c.criteria||[],
          reglement: c.reglement||"",
          hidden: c.hidden||false,
          endDate: c.end_date||"",
          restaurants: c.restaurants||["Decize","Avermes","Moulins"],
        });
      })
      .subscribe();

    return () => {
      db.removeChannel(chanParticipants);
      db.removeChannel(chanConfig);
    };
  }, []);

  const addLog = useCallback(async (msg) => {
    await dbAddLog(msg);
    const l = await dbGetLog();
    setLog(l);
  }, []);

  const resetLogoutTimer = useCallback(() => {
    if (logoutTimer.current) clearTimeout(logoutTimer.current);
    logoutTimer.current = setTimeout(() => setView("public"), AUTO_LOGOUT_MS);
  }, []);

  useEffect(() => {
    if (view === "admin") resetLogoutTimer();
    else if (logoutTimer.current) clearTimeout(logoutTimer.current);
  }, [view, resetLogoutTimer]);

  const ranked = [...participants]
    .map(p => ({ ...p, total: computeTotal(p, config.criteria) }))
    .sort((a, b) => b.total - a.total);

  if (!ready) return (
    <div style={{ background:"#FFF8E7", minHeight:"100vh", display:"flex", alignItems:"center", justifyContent:"center" }}>
      <div style={{ textAlign:"center" }}>
        <div style={{ fontSize:48, marginBottom:16 }}>🍔</div>
        <p style={{ color:"#DA291C", fontWeight:700, fontSize:18 }}>Chargement en cours…</p>
      </div>
    </div>
  );

  if (view === "pingate") return (
    <AuthGate auth={auth} setAuth={setAuth}
      onSuccess={() => { setView("admin"); resetLogoutTimer(); }}
      onBack={() => setView("public")} />
  );
  if (view === "admin") return (
    <AdminView config={config} setConfig={setConfig}
      participants={participants} setParticipants={setParticipants}
      ranked={ranked} auth={auth} setAuth={setAuth}
      log={log} addLog={addLog}
      onBack={() => { setView("public"); if (logoutTimer.current) clearTimeout(logoutTimer.current); }}
      resetLogoutTimer={resetLogoutTimer} />
  );
  return <PublicView config={config} ranked={ranked} participants={participants} onAdminClick={() => setView("pingate")} />;
}

function MangaCountdown({ target, color }) {
  const [secs,setSecs]=useState(Math.max(0,Math.ceil((target-Date.now())/1000)));
  useEffect(()=>{const iv=setInterval(()=>{const r=Math.max(0,Math.ceil((target-Date.now())/1000));setSecs(r);if(!r)clearInterval(iv);},1000);return()=>clearInterval(iv);},[target]);
  if(!secs)return null;
  const d=Math.floor(secs/86400),h=Math.floor((secs%86400)/3600),m=Math.floor((secs%3600)/60),s=secs%60;
  const Block=({val,label})=>(
    <div style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:3}}>
      <div style={{width:"100%",background:"#000",border:`2px solid ${color}`,borderRadius:7,padding:"6px 3px",textAlign:"center",boxShadow:`inset 0 0 12px ${color}18, 0 0 8px ${color}33`,position:"relative",overflow:"hidden"}}>
        <div style={{position:"absolute",top:"33%",left:0,right:0,height:1,background:`${color}20`}}/>
        <div style={{position:"absolute",top:"66%",left:0,right:0,height:1,background:`${color}20`}}/>
        <div style={{fontFamily:"'Share Tech Mono',monospace",fontSize:28,color:color,lineHeight:1,textShadow:`0 0 12px ${color},0 0 24px ${color}66`}}>{String(val).padStart(2,"0")}</div>
      </div>
      <div style={{fontSize:8,letterSpacing:3,color:"rgba(255,255,255,0.3)"}}>{label}</div>
    </div>
  );
  const Sep=()=><div style={{fontFamily:"'Share Tech Mono',monospace",fontSize:22,color:`${color}66`,paddingBottom:18,alignSelf:"center",lineHeight:1}}>:</div>;
  return(
    <div style={{display:"flex",gap:5,alignItems:"flex-end"}}>
      {d>0&&<><Block val={d} label="JOURS"/><Sep/></>}
      <Block val={h} label="HEURES"/><Sep/><Block val={m} label="MINUTES"/><Sep/><Block val={s} label="SECONDES"/>
    </div>
  );
}

// ── AUTH GATE ─────────────────────────────────────────────────────────────────
function AuthGate({ auth, setAuth, onSuccess, onBack }) {
  const [step, setStep]       = useState("pin");
  const [pin, setPin]         = useState("");
  const [pwd, setPwd]         = useState("");
  const [showPwd, setShowPwd] = useState(false);
  const [err, setErr]         = useState("");
  const [shake, setShake]     = useState(false);
  const [cd, setCd]           = useState(0);

  useEffect(() => {
    if (!auth?.lockedUntil) return;
    const iv = setInterval(() => {
      const r = Math.max(0, Math.ceil((auth.lockedUntil - Date.now()) / 1000));
      setCd(r);
      if (!r) clearInterval(iv);
    }, 1000);
    setCd(Math.max(0, Math.ceil((auth.lockedUntil - Date.now()) / 1000)));
    return () => clearInterval(iv);
  }, [auth?.lockedUntil]);

  const locked   = auth?.lockedUntil && Date.now() < auth.lockedUntil;
  const left     = MAX_ATTEMPTS - (auth?.attempts || 0);

  function trig(msg) { setErr(msg); setShake(true); setTimeout(() => setShake(false), 500); }

  async function checkPin(val) {
    const h = await hashValue(val);
    if (h === auth.pinHash) { setErr(""); setStep("password"); setPin(""); }
    else {
      const na = (auth.attempts || 0) + 1, lk = na >= MAX_ATTEMPTS;
      const newA1 = { ...auth, attempts: lk ? 0 : na, lockedUntil: lk ? Date.now() + LOCKOUT_MS : null };
      setAuth(newA1); dbSaveAuth(newA1);
      setPin("");
      trig(lk ? "Accès bloqué 5 minutes." : `PIN incorrect. ${MAX_ATTEMPTS - na} essai(s) restant(s).`);
    }
  }
  async function checkPwd() {
    const h = await hashValue(pwd);
    if (h === auth.passwordHash) { const newA3={...auth,attempts:0,lockedUntil:null}; setAuth(newA3); dbSaveAuth(newA3); setPwd(""); onSuccess(); }
    else {
      const na = (auth.attempts || 0) + 1, lk = na >= MAX_ATTEMPTS;
      const newA2 = { ...auth, attempts: lk ? 0 : na, lockedUntil: lk ? Date.now() + LOCKOUT_MS : null };
      setAuth(newA2); dbSaveAuth(newA2);
      setPwd("");
      trig(lk ? "Accès bloqué 5 minutes." : `Mot de passe incorrect. ${MAX_ATTEMPTS - na} essai(s) restant(s).`);
    }
  }

  return (
    <div style={s.pinPage}>
      <div style={{ ...s.pinBox, animation: shake ? "shake 0.4s" : "none" }}>
        <div style={s.stepBar}>
          <div style={{ ...s.stepDot, background:"#FFD700" }}>1</div>
          <div style={{ ...s.stepLine, background: step==="password" ? "#FFD700" : "rgba(255,255,255,0.15)" }}/>
          <div style={{ ...s.stepDot, background: step==="password" ? "#FFD700" : "rgba(255,255,255,0.15)", color: step==="password" ? "#0a0e1a" : "#6b7280" }}>2</div>
        </div>
        <p style={s.stepLabel}>{step === "pin" ? "Étape 1/2 — Code PIN" : "Étape 2/2 — Mot de passe"}</p>
        <div style={{ fontSize:36 }}>{step === "pin" ? "🔢" : "🔑"}</div>
        <h2 style={s.pinTitle}>Accès Administrateur</h2>

        {locked ? (
          <div style={s.lockoutBox}>
            <div style={{ fontSize:40 }}>🔒</div>
            <p style={{ color:"#f87171", fontWeight:700, margin:"8px 0 4px" }}>Accès bloqué</p>
            <p style={{ color:"#9ca3af", fontSize:13 }}>Réessayez dans <strong style={{ color:"#FFD700" }}>{Math.floor(cd/60)}:{String(cd%60).padStart(2,"0")}</strong></p>
          </div>
        ) : step === "pin" ? (
          <>
            <p style={s.pinSub}>Code PIN à 4 chiffres</p>
            <div style={s.pinDots}>
              {[0,1,2,3].map(i => <div key={i} style={{ ...s.pinDot, background: pin.length > i ? "#FFD700" : "rgba(255,255,255,0.15)" }}/>)}
            </div>
            <div style={s.pinGrid}>
              {[1,2,3,4,5,6,7,8,9,"",0,"⌫"].map((k, i) => (
                <button key={i} style={k==="" ? { visibility:"hidden" } : s.pinKey}
                  onClick={async () => {
                    if (k === "⌫") { setPin(p => p.slice(0,-1)); setErr(""); }
                    else if (typeof k === "number" && pin.length < 4) {
                      const nx = pin + k; setPin(nx);
                      if (nx.length === 4) await checkPin(nx);
                    }
                  }}>{k}</button>
              ))}
            </div>
          </>
        ) : (
          <>
            <p style={s.pinSub}>Mot de passe administrateur</p>
            <div style={s.passwordWrap}>
              <input type={showPwd ? "text" : "password"} style={s.passwordInput} autoFocus
                placeholder="Mot de passe" value={pwd}
                onChange={e => { setPwd(e.target.value); setErr(""); }}
                onKeyDown={e => e.key === "Enter" && checkPwd()}/>
              <button style={s.eyeBtn} onClick={() => setShowPwd(v => !v)}>{showPwd ? "🙈" : "👁"}</button>
            </div>
            <div style={{ display:"flex", gap:10, marginTop:14 }}>
              <button style={s.pinCancel} onClick={() => { setStep("pin"); setPwd(""); setErr(""); }}>← PIN</button>
              <button style={s.pinSubmit} onClick={checkPwd}>Valider</button>
            </div>
          </>
        )}
        {err && <p style={s.pinError}>{err}</p>}
        {!err && (auth?.attempts||0) > 0 && !locked && <p style={{ ...s.pinError, color:"#fb923c" }}>⚠ {left} essai(s) avant blocage</p>}
        <button style={{ ...s.pinCancel, marginTop:14 }} onClick={onBack}>Annuler</button>
      </div>
      <style>{`@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}`}</style>
    </div>
  );
}

// ── ADMIN VIEW ────────────────────────────────────────────────────────────────
function AdminView({ config, setConfig, participants, setParticipants, ranked, auth, setAuth, log, addLog, onBack, resetLogoutTimer }) {
  const [tab, setTab]         = useState("participants");
  const [editP, setEditP]     = useState(null);
  const [newName, setNewName] = useState("");
  const [newPin, setNewPin]   = useState("");
  const [newPwd, setNewPwd]   = useState("");
  const [newPwdC, setNewPwdC] = useState("");
  const [showNP, setShowNP]   = useState(false);
  const [pinMsg, setPinMsg]   = useState("");
  const [pwdMsg, setPwdMsg]   = useState("");
  const [dragIdx, setDragIdx] = useState(null);

  const act = fn => (...a) => { resetLogoutTimer(); fn(...a); };
  // Debounced config save
  const configSaveTimer = useRef(null);
  const saveConfigDebounced = useCallback((newConfig) => {
    if (configSaveTimer.current) clearTimeout(configSaveTimer.current);
    configSaveTimer.current = setTimeout(() => dbSaveConfig(newConfig), 600);
  }, []);

  async function addParticipant() {
    if (!newName.trim()) return;
    const newP = { id: crypto.randomUUID(), name:newName.trim(), scores:{}, notes:{}, updatedAt:Date.now() };
    await dbSaveParticipant(newP);
    addLog("Participant ajouté : " + newName.trim());
    setNewName("");
  }
  async function removeParticipant(id, name) {
    await dbDeleteParticipant(id);
    if (editP?.id === id) setEditP(null);
    addLog("Participant supprimé : " + name);
  }
  async function updateScore(pid, cid, val) {
    const updated = participants.find(p=>p.id===pid);
    if (!updated) return;
    const newP = { ...updated, scores:{...updated.scores,[cid]:val}, updatedAt:Date.now() };
    setEditP(ep => ep?.id===pid ? { ...ep, scores:{...ep.scores,[cid]:val} } : ep);
    await dbSaveParticipant(newP);
  }
  async function updateNote(pid, cid, val) {
    const updated = participants.find(p=>p.id===pid);
    if (!updated) return;
    const newP = { ...updated, notes:{...(updated.notes||{}),[cid]:val} };
    setEditP(ep => ep?.id===pid ? { ...ep, notes:{...(ep.notes||{}),[cid]:val} } : ep);
    await dbSaveParticipant(newP);
  }
  function addCriterion() {
    setConfig(c => { const n={...c,criteria:[...c.criteria,{id:Date.now().toString(),name:"Nouveau critère",max:10,weight:1,description:""}]}; saveConfigDebounced(n); return n; });
  }
  function updCrit(id, f, v) { setConfig(c => { const n={...c,criteria:c.criteria.map(cr=>cr.id===id?{...cr,[f]:v}:cr)}; saveConfigDebounced(n); return n; }); }
  function delCrit(id) { setConfig(c => { const n={...c,criteria:c.criteria.filter(cr=>cr.id!==id)}; saveConfigDebounced(n); return n; }); }

  function onDragStart(i) { setDragIdx(i); }
  function onDragOver(e, i) {
    e.preventDefault();
    if (dragIdx === null || dragIdx === i) return;
    const cr = [...config.criteria]; const [m] = cr.splice(dragIdx, 1); cr.splice(i, 0, m);
    setConfig(c => { const n={...c,criteria:cr}; saveConfigDebounced(n); return n; }); setDragIdx(i);
  }
  function onDragEnd() { setDragIdx(null); }

  async function savePin() {
    if (!/^\d{4}$/.test(newPin)) { setPinMsg("❌ 4 chiffres requis."); return; }
    const h = await hashValue(newPin);
    const newAuth = { ...auth, pinHash:h, attempts:0, lockedUntil:null };
    setAuth(newAuth);
    await dbSaveAuth(newAuth);
    setNewPin(""); setPinMsg("✅ PIN mis à jour !"); addLog("PIN modifié");
    setTimeout(() => setPinMsg(""), 2500);
  }
  async function savePwd() {
    if (newPwd.length < 8) { setPwdMsg("❌ Minimum 8 caractères."); return; }
    if (newPwd !== newPwdC) { setPwdMsg("❌ Les mots de passe ne correspondent pas."); return; }
    const h = await hashValue(newPwd);
    const newAuth = { ...auth, passwordHash:h, attempts:0, lockedUntil:null };
    setAuth(newAuth);
    await dbSaveAuth(newAuth);
    setNewPwd(""); setNewPwdC(""); setPwdMsg("✅ Mot de passe mis à jour !"); addLog("Mot de passe modifié");
    setTimeout(() => setPwdMsg(""), 2500);
  }
  function exportPDF() {
    const rows = ranked.map((p,i) => `<tr><td>${MEDAL[i]||"#"+(i+1)}</td><td>${p.name}</td>${config.criteria.map(c=>`<td>${p.scores?.[c.id]??"—"}</td>`).join("")}<td><strong>${p.total.toFixed(2)}</strong></td></tr>`).join("");
    const ths  = config.criteria.map(c => `<th>${c.name}</th>`).join("");
    const html = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>${config.title}</title><style>body{font-family:Arial;padding:20px}h1{color:#DA291C}table{border-collapse:collapse;width:100%}th,td{border:1px solid #ccc;padding:8px}th{background:#FFC72C}tr:nth-child(even){background:#f9f9f9}</style></head><body><h1>${config.title}</h1><p>Généré le ${fmtDate(Date.now())}</p><table><thead><tr><th>#</th><th>Participant</th>${ths}<th>Score</th></tr></thead><tbody>${rows}</tbody></table></body></html>`;
    const w = window.open("","_blank"); w.document.write(html); w.document.close(); setTimeout(() => w.print(), 300);
    addLog("Export PDF généré");
  }

  const TABS = { participants:"👥 Participants", criteria:"📊 Critères", reglement:"📋 Règlement", historique:"🕒 Historique", settings:"🔧 Réglages" };

  return (
    <div style={s.adminPage} onClick={resetLogoutTimer}>
      <header style={s.adminHeader}>
        <button style={s.backBtn} onClick={onBack}>← Vue publique</button>
        <h2 style={s.adminTitle}>⚙️ Administration</h2>
        <div style={s.tabBar}>
          {Object.entries(TABS).map(([k,v]) => (
            <button key={k} style={{ ...s.tabBtn, ...(tab===k ? s.tabActive : {}) }} onClick={() => setTab(k)}>{v}</button>
          ))}
        </div>
      </header>

      <div style={s.adminBody}>

        {/* PARTICIPANTS */}
        {tab === "participants" && (
          <div style={s.section}>
            <h3 style={s.sectionTitle}>Ajouter un participant</h3>
            <div style={s.row}>
              <input style={s.input} placeholder="Nom" value={newName}
                onChange={act(e => setNewName(e.target.value))}
                onKeyDown={e => e.key==="Enter" && addParticipant()}/>
              <button style={s.addBtn} onClick={act(addParticipant)}>+ Ajouter</button>
            </div>
            <h3 style={{ ...s.sectionTitle, marginTop:28 }}>Liste ({participants.length})</h3>
            {participants.length === 0 && <p style={s.emptyText}>Aucun participant.</p>}
            <div style={s.pList}>
              {ranked.map((p, i) => {
                const full = participants.find(x => x.id===p.id) || p;
                return (
                  <div key={p.id} style={s.pCard}>
                    <div style={s.pCardHead}>
                      <span style={s.pRank}>{MEDAL[i] || `#${i+1}`}</span>
                      <span style={s.pName}>{p.name}</span>
                      {p.restaurant && <span style={s.restaurantBadge}>{p.restaurant}</span>}
                      <span style={s.pTotal}>{p.total.toFixed(2)} pts</span>
                      <button style={s.editBtn} onClick={act(() => setEditP(editP?.id===p.id ? null : full))}>
                        {editP?.id===p.id ? "▲ Fermer" : "✏️ Scores"}
                      </button>
                      <button style={s.delBtn} onClick={act(() => removeParticipant(p.id, p.name))}>🗑</button>
                    </div>
                    {editP?.id === p.id && (
                      <div style={s.scoreGrid}>
                        {/* Restaurant selector */}
                        <div style={s.scoreBlock}>
                          <label style={{ ...s.scoreLabel, fontWeight:700 }}>🍔 Restaurant</label>
                          <div style={{ display:"flex", gap:8, flexWrap:"wrap", marginTop:4 }}>
                            {(config.restaurants||[]).map(resto => (
                              <button key={resto}
                                style={{ ...s.restoBtn, ...(full.restaurant===resto ? s.restoBtnActive : {}) }}
                                onClick={act(() => {
                                  const updP = participants.find(x=>x.id===p.id);
                                  if(updP){ const np={...updP,restaurant:resto}; dbSaveParticipant(np); }
                                  setEditP(ep => ep?.id===p.id ? { ...ep, restaurant:resto } : ep);
                                  addLog(`${p.name} assigné à ${resto}`);
                                })}>
                                {resto}
                              </button>
                            ))}
                            {full.restaurant && (
                              <button style={s.restoBtnClear} onClick={act(() => {
                                const updP2 = participants.find(x=>x.id===p.id);
                                if(updP2){ const np={...updP2,restaurant:null}; dbSaveParticipant(np); }
                                setEditP(ep => ep?.id===p.id ? { ...ep, restaurant:undefined } : ep);
                              })}>✕ Retirer</button>
                            )}
                          </div>
                        </div>
                        {config.criteria.length===0 && <p style={s.emptyText}>Ajoutez d'abord des critères.</p>}
                        {config.criteria.map(c => (
                          <div key={c.id} style={s.scoreBlock}>
                            <div style={s.scoreBlockHeader}>
                              <label style={s.scoreLabel}>{c.name} <span style={s.scoreMax}>(max {c.max})</span></label>
                              <input type="number" min={0} max={c.max} step="0.5" style={s.scoreInput}
                                value={full.scores?.[c.id] ?? ""}
                                onChange={act(e => updateScore(p.id, c.id, e.target.value))}/>
                            </div>
                            <textarea style={s.noteInput}
                              placeholder={`Détail résultat pour « ${c.name} »…`}
                              value={full.notes?.[c.id] ?? ""}
                              onChange={act(e => updateNote(p.id, c.id, e.target.value))}/>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          </div>
        )}

        {/* CRITÈRES */}
        {tab === "criteria" && (
          <div style={s.section}>
            <div style={s.row}>
              <h3 style={s.sectionTitle}>Critères & Barème</h3>
              <button style={s.addBtn} onClick={act(addCriterion)}>+ Ajouter</button>
            </div>
            <p style={s.helpText}>Score final = Σ (score / max × coefficient) · Glisser pour réordonner</p>
            {config.criteria.length === 0 && <p style={s.emptyText}>Aucun critère.</p>}
            <div style={s.criteriaList}>
              {config.criteria.map((c, i) => (
                <div key={c.id} style={{ ...s.criterionCard, opacity:dragIdx===i?0.5:1, cursor:"grab" }}
                  draggable onDragStart={() => onDragStart(i)} onDragOver={e => onDragOver(e,i)} onDragEnd={onDragEnd}>
                  <span style={s.criterionNum}>⋮ #{i+1}</span>
                  <div style={s.criterionFields}>
                    <div style={s.fieldGroup}><label style={s.fieldLabel}>Nom</label><input style={s.input} value={c.name} onChange={act(e => updCrit(c.id,"name",e.target.value))}/></div>
                    <div style={s.fieldGroup}><label style={s.fieldLabel}>Max pts</label><input type="number" min={1} style={{ ...s.input, maxWidth:90 }} value={c.max} onChange={act(e => updCrit(c.id,"max",e.target.value))}/></div>
                    <div style={s.fieldGroup}><label style={s.fieldLabel}>Coefficient</label><input type="number" min={0} step="0.5" style={{ ...s.input, maxWidth:90 }} value={c.weight} onChange={act(e => updCrit(c.id,"weight",e.target.value))}/></div>
                    <div style={{ ...s.fieldGroup, flex:2, minWidth:180 }}>
                      <label style={s.fieldLabel}>Description</label>
                      <textarea style={{ ...s.input, minHeight:52, resize:"vertical" }} value={c.description??""} onChange={act(e => updCrit(c.id,"description",e.target.value))}/>
                    </div>
                  </div>
                  <button style={s.delBtn} onClick={act(() => delCrit(c.id))}>🗑</button>
                </div>
              ))}
            </div>
            {config.criteria.length > 0 && (
              <div style={s.bareme}>
                <p style={s.baremeTitle}>Récapitulatif</p>
                {config.criteria.map(c => (
                  <div key={c.id} style={s.baremeRow}>
                    <span>{c.name}</span>
                    <span style={s.baremeVal}>max {c.max} pts × coeff {c.weight} = {parseFloat(c.weight)||0} pts pondérés</span>
                  </div>
                ))}
                <div style={{ ...s.baremeRow, fontWeight:700, color:"#FFD700", marginTop:8 }}>
                  <span>TOTAL MAX</span>
                  <span>{config.criteria.reduce((s,c) => s+(parseFloat(c.weight)||0), 0)} pts</span>
                </div>
              </div>
            )}
          </div>
        )}

        {/* RÈGLEMENT */}
        {tab === "reglement" && (
          <div style={s.section}>
            <h3 style={s.sectionTitle}>📋 Règlement du concours</h3>
            <p style={s.helpText}>Rédigez librement. Visible dans l'onglet "Règlement" de la vue publique.</p>
            <textarea style={{ ...s.input, marginTop:12, minHeight:380, resize:"vertical", lineHeight:1.7, fontSize:14, fontFamily:"inherit" }}
              placeholder={"Rédigez ici le règlement du concours...\n\nEx :\nArticle 1 — Participants\n...\n\nArticle 2 — Critères\n..."}
              value={config.reglement ?? ""}
              onChange={act(e => { const v = e.target.value; setConfig(c => { const n={...c,reglement:v}; saveConfigDebounced(n); return n; }); })}/>
            <div style={{ marginTop:10, display:"flex", alignItems:"center", gap:12 }}>
              <span style={{ color:"#6b7280", fontSize:12 }}>{(config.reglement??"").length} caractères</span>
              {config.reglement && (
                <button style={s.dangerBtn} onClick={act(() => { if (window.confirm("Effacer ?")) { setConfig(c => { const n={...c,reglement:""}; dbSaveConfig(n); return n; }); }; })}>🗑 Effacer</button>
              )}
            </div>
          </div>
        )}

        {/* HISTORIQUE */}
        {tab === "historique" && (
          <div style={s.section}>
            <div style={s.row}>
              <h3 style={s.sectionTitle}>🕒 Historique des modifications</h3>
              <button style={s.dangerBtn} onClick={() => { if (window.confirm("Effacer l'historique ?")) setLog([]); }}>🗑 Effacer</button>
            </div>
            {log.length === 0 ? <p style={s.emptyText}>Aucune action enregistrée.</p> : (
              <div style={s.logList}>
                {log.map((l, i) => (
                  <div key={i} style={s.logItem}>
                    <span style={s.logTs}>{fmtDate(l.ts)}</span>
                    <span style={s.logMsg}>{l.msg}</span>
                  </div>
                ))}
              </div>
            )}
          </div>
        )}

        {/* RÉGLAGES */}
        {tab === "settings" && (
          <div style={s.section}>
            <h3 style={s.sectionTitle}>Informations du concours</h3>
            <div style={s.fieldGroup}><label style={s.fieldLabel}>Titre</label><input style={s.input} value={config.title} onChange={act(e => { const v = e.target.value; setConfig(c => { const n={...c,title:v}; saveConfigDebounced(n); return n; }); })}/></div>
            <div style={s.fieldGroup}><label style={s.fieldLabel}>Sous-titre</label><input style={s.input} value={config.subtitle} onChange={act(e => { const v = e.target.value; setConfig(c => { const n={...c,subtitle:v}; saveConfigDebounced(n); return n; }); })}/></div>
            <div style={s.fieldGroup}><label style={s.fieldLabel}>Date de fin du concours (compte à rebours)</label><input type="datetime-local" style={s.input} value={config.endDate||""} onChange={act(e => { const v = e.target.value; setConfig(c => { const n={...c,endDate:v}; saveConfigDebounced(n); return n; }); })}/></div>

            <div style={s.fieldGroup}><label style={s.fieldLabel}>🚀 Date de top départ (compte à rebours jaune)</label><input type="datetime-local" style={s.input} value={config.startDate||""} onChange={act(e => { const v = e.target.value; setConfig(c => { const n={...c,startDate:v}; saveConfigDebounced(n); return n; }); })}/></div>

            <div style={{ ...s.authSection, marginTop:24 }}>
              <div style={s.authSectionHeader}>
                <span style={{ fontSize:22 }}>🍔</span>
                <div>
                  <h3 style={{ margin:0, color:"#e8eaf6", fontSize:16 }}>Restaurants</h3>
                  <p style={s.helpText}>Gérez les restaurants du concours</p>
                </div>
              </div>
              <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
                {(config.restaurants||[]).map((r, i) => (
                  <div key={i} style={{ display:"flex", gap:8, alignItems:"center" }}>
                    <input style={{ ...s.input, flex:1 }} value={r}
                      onChange={act(e => {
                        const rs = [...(config.restaurants||[])];
                        rs[i] = e.target.value;
                        setConfig(c => { const n={...c,restaurants:rs}; saveConfigDebounced(n); return n; });
                      })}/>
                    <button style={s.delBtn} onClick={act(() => {
                      const rs = (config.restaurants||[]).filter((_,j) => j!==i);
                      setConfig(c => { const n={...c,restaurants:rs}; saveConfigDebounced(n); return n; });
                    })}>🗑</button>
                  </div>
                ))}
                <button style={{ ...s.addBtn, alignSelf:"flex-start", marginTop:4 }}
                  onClick={act(() => setConfig(c => { const n={...c,restaurants:[...(c.restaurants||[]),("Nouveau restaurant")]}; saveConfigDebounced(n); return n; }))}>
                  + Ajouter un restaurant
                </button>
              </div>
            </div>

            <div style={{ ...s.authSection, marginTop:24 }}>
              <div style={s.authSectionHeader}>
                <span style={{ fontSize:22 }}>🔒</span>
                <div>
                  <h3 style={{ margin:0, color:"#e8eaf6", fontSize:16 }}>Visibilité du classement</h3>
                  <p style={s.helpText}>Masquer temporairement les résultats au public</p>
                </div>
              </div>
              <div style={s.row}>
                <button style={{ ...s.addBtn, background:config.hidden?"#f87171":"#4ade80", color:"#1a1a1a" }}
                  onClick={act(() => { setConfig(c => { const n={...c,hidden:!c.hidden}; dbSaveConfig(n); return n; }); addLog(config.hidden ? "Classement rendu visible" : "Classement masqué"); })}>
                  {config.hidden ? "👁 Afficher le classement" : "🔒 Masquer le classement"}
                </button>
                <span style={{ color:config.hidden?"#f87171":"#4ade80", fontSize:13, fontWeight:700 }}>
                  {config.hidden ? "Masqué" : "Visible"}
                </span>
              </div>
            </div>

            <div style={s.authSection}>
              <div style={s.authSectionHeader}>
                <span style={{ fontSize:22 }}>📄</span>
                <div><h3 style={{ margin:0, color:"#e8eaf6", fontSize:16 }}>Export PDF</h3><p style={s.helpText}>Génère une page imprimable du classement</p></div>
              </div>
              <button style={s.addBtn} onClick={act(exportPDF)}>📄 Générer le PDF</button>
            </div>

            <div style={s.authSection}>
              <div style={s.authSectionHeader}><span style={{ fontSize:22 }}>🔢</span><div><h3 style={{ margin:0, color:"#e8eaf6", fontSize:16 }}>Code PIN (étape 1)</h3><p style={s.helpText}>4 chiffres</p></div></div>
              <div style={s.row}>
                <input type="password" inputMode="numeric" maxLength={4} style={{ ...s.input, maxWidth:140, letterSpacing:6, fontSize:20 }}
                  placeholder="••••" value={newPin} onChange={act(e => setNewPin(e.target.value.replace(/\D/g,"")))}/>
                <button style={s.addBtn} onClick={act(savePin)}>Enregistrer</button>
              </div>
              {pinMsg && <p style={{ color:pinMsg.startsWith("✅")?"#4ade80":"#f87171", marginTop:8, fontSize:13 }}>{pinMsg}</p>}
            </div>

            <div style={s.authSection}>
              <div style={s.authSectionHeader}><span style={{ fontSize:22 }}>🔑</span><div><h3 style={{ margin:0, color:"#e8eaf6", fontSize:16 }}>Mot de passe (étape 2)</h3><p style={s.helpText}>Minimum 8 caractères</p></div></div>
              <div style={s.fieldGroup}>
                <label style={s.fieldLabel}>Nouveau mot de passe</label>
                <div style={s.passwordWrap}>
                  <input type={showNP?"text":"password"} style={{ ...s.input, paddingRight:44 }} value={newPwd}
                    onChange={act(e => { setNewPwd(e.target.value); setPwdMsg(""); })}/>
                  <button style={s.eyeBtn} onClick={() => setShowNP(v=>!v)}>{showNP?"🙈":"👁"}</button>
                </div>
              </div>
              <div style={s.fieldGroup}>
                <label style={s.fieldLabel}>Confirmer</label>
                <input type="password" style={s.input} value={newPwdC}
                  onChange={act(e => { setNewPwdC(e.target.value); setPwdMsg(""); })}
                  onKeyDown={e => e.key==="Enter" && savePwd()}/>
              </div>
              <button style={{ ...s.addBtn, marginTop:6, alignSelf:"flex-start" }} onClick={act(savePwd)}>Enregistrer</button>
              {pwdMsg && <p style={{ color:pwdMsg.startsWith("✅")?"#4ade80":"#f87171", marginTop:8, fontSize:13 }}>{pwdMsg}</p>}
            </div>

            <div style={s.authInfo}>
              <p style={{ margin:0, color:"#6b7280", fontSize:12 }}>🛡 Identifiants stockés en SHA-256. Blocage après {MAX_ATTEMPTS} tentatives / {LOCKOUT_MS/60000} min. Déconnexion auto après {AUTO_LOGOUT_MS/60000} min d'inactivité.</p>
              <p style={{ margin:"6px 0 0", color:"#6b7280", fontSize:12 }}>Par défaut — PIN : <code style={{ color:"#FFD700" }}>1234</code> · Mot de passe : <code style={{ color:"#FFD700" }}>Admin2024!</code></p>
            </div>

            <h3 style={{ ...s.sectionTitle, marginTop:32, color:"#f87171" }}>Zone dangereuse</h3>
            <button style={s.dangerBtn} onClick={act(() => { if (window.confirm("Supprimer TOUS les participants ?")) { db.from("participants").delete().neq("id","00000000-0000-0000-0000-000000000000").then(()=>{ setParticipants([]); addLog("Tous les participants supprimés"); }); } })}>🗑 Réinitialiser participants</button>
            <button style={{ ...s.dangerBtn, marginLeft:10 }} onClick={act(() => { if (window.confirm("Supprimer TOUS les critères ?")) { setConfig(c => { const n={...c,criteria:[]}; dbSaveConfig(n); return n; }); addLog("Critères supprimés"); } })}>🗑 Réinitialiser critères</button>
          </div>
        )}
      </div>
    </div>
  );
}

// ── McDONALD'S STYLES ─────────────────────────────────────────────────────────
const mc = {
  page:              { minHeight:"100vh", background:"#FFF8E7", fontFamily:"'Nunito','Arial Rounded MT Bold',sans-serif", position:"relative", overflow:"hidden" },
  bgLeft:            { position:"fixed", top:0, left:-80, width:260, height:"100vh", background:"linear-gradient(180deg,#DA291C,#c0221a)", zIndex:0, clipPath:"polygon(0 0,80% 0,100% 100%,0 100%)", opacity:0.08, pointerEvents:"none" },
